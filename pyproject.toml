[project]
name = "tabsight"
version = "0.1.0"
description = "Local audiovisual fingerstyle transcription and practice workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "python-multipart>=0.0.20",
  "numpy>=1.26,<2",
  "scipy>=1.13",
  "librosa>=0.10.2,<0.12",
  "soundfile>=0.13",
  "torch>=2.6,<3",
  "torchlibrosa>=0.1",
  "mido>=1.3",
  "pretty-midi>=0.2.10",
  "pyguitarpro>=0.11",
  "huggingface-hub>=0.27",
  "requests>=2.32",
  "yt-dlp>=2026.1.1",
  "piano-transcription-inference @ git+https://github.com/xavriley/piano_transcription_inference.git",
  "audioread>=3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
